name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          # <user>.github.io repos are served from "/", every other repo from "/<repo-name>/"
          case "$GITHUB_REPOSITORY" in
            */*.github.io) export VITE_BASE="/" ;;
            *) export VITE_BASE="/${GITHUB_REPOSITORY#*/}/" ;;
          esac
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # No API address set => build the self-contained demo (in-browser sample backend).
          # Set the VITE_API_BASE_URL repository variable later to publish against a real server instead.
          VITE_DEMO_MODE: ${{ vars.VITE_API_BASE_URL == '' && 'true' || 'false' }}
          VITE_ENABLE_ROLE_PICKER: "false"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
